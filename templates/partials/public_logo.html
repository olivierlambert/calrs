<div class="logo">{% if company_link %}<a href="{{ company_link }}" target="_blank" rel="noopener noreferrer">{% endif %}<img class="logo-light" src="/logo" alt="" onerror="this.closest('.logo').style.display='none'"><img class="logo-dark" src="/logo/dark" alt="" onerror="this.closest('.logo').style.display='none'">{% if company_link %}</a>{% endif %}</div>
