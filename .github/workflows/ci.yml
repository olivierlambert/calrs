name: CI

on:
  push:
    branches: [main, i18n, "[0-9]*.[0-9]*.x"]
  pull_request:
    # i18n is a permanent branch, and CLAUDE.md tells contributors to target it
    # for anything touching UI text. Without it here those PRs get no CI at all.
    # X.Y.x are maintenance branches (1.23.x): fixes cherry-picked there need
    # CI too, and a push or PR uses that branch's own copy of this file.
    branches: [main, i18n, "[0-9]*.[0-9]*.x"]

env:
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  templates:
    name: Templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check templates for unclosed blocks
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            opens=$(grep -c '{%[- ]*block ' "$f" || true)
            closes=$(grep -c '{%[- ]*endblock' "$f" || true)
            if [ "$opens" != "$closes" ]; then
              echo "Unbalanced block/endblock in $f (block: $opens, endblock: $closes)"
              fail=1
            fi
          done < <(find templates -name '*.html' -print0)
          exit $fail

  migrations:
    # #333: a PR's new migrations must sort after the newest one on its base,
    # or fresh installs and upgraded databases apply them in different orders.
    # On push it re-checks what landed, for PRs whose run predates a merge.
    name: Migration order
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check migrations against the base
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then exit 0; fi
          scripts/check-migrations.sh "$BASE"

  tzdata:
    # #285: calrs converts every time through the tz database it bundles in
    # vendor/chrono-tz. Fail while IANA has a newer one, so a stale copy is
    # noticed before a release rather than when a zone's clocks change.
    name: tzdata current
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-tzdata.sh

  check:
    name: Clippy + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --profile=test
      - run: cargo test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Run coverage
        run: cargo tarpaulin --out xml --skip-clean
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
